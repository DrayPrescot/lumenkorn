[package]
name = "lumenkorn-core"
description = "Plattformunabhängiger Kern von Lumenkorn: Katalog, Ordner-Scan, Projekte, Thumbnails"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
blake3 = "1.8.7"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "tiff", "webp", "rayon"] }
kamadak-exif = "0.6.1"
lumenkorn-develop = { path = "../lumenkorn-develop" }
log = "0.4.34"
notify = "8.2.0"
rayon = "1.12.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"

[[example]]
name = "scan"
