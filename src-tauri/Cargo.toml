[package]
name = "lumenkorn"
description = "Lumenkorn – lokale, KI-gestützte Fotoverwaltung und -entwicklung"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[lib]
# Auf Android wird die App als Bibliothek geladen.
name = "lumenkorn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lumenkorn-core = { path = "../crates/lumenkorn-core" }
lumenkorn-develop = { path = "../crates/lumenkorn-develop" }
lumenkorn-ai = { path = "../crates/lumenkorn-ai" }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
log = "0.4"
env_logger = "0.11"

# Papierkorb des Betriebssystems (Windows, macOS, Linux/freedesktop)
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
trash = "5"
