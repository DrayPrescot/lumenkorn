name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # GPU tests use a software Vulkan driver (Mesa lavapipe) on Linux runners
  LUMENKORN_GPU_SOFTWARE: "1"

jobs:
  frontend:
    name: Frontend (svelte-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run i18n
      - run: npm run build

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev mesa-vulkan-drivers

      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # The Tauri crate embeds the built frontend at compile time
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # Echte RAWs von sechs Kameras (OpenImageIO-Testbilder): Damit prüfen die
      # Tests jede neue rawler-Version gegen unser eigenes Demosaicing.
      - name: Cache sample RAWs
        if: runner.os == 'Linux'
        id: rawcache
        uses: actions/cache@v4
        with:
          path: raw-samples
          key: oiio-raw-samples-ci-v1
      - name: Download sample RAWs
        if: runner.os == 'Linux' && steps.rawcache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/AcademySoftwareFoundation/OpenImageIO-images raw-samples/oiio
          git -C raw-samples/oiio sparse-checkout set raw
          # Nur Kameras, die rawler unterstützt (die Pentax K200D nicht)
          mkdir -p raw-samples/ci
          cp raw-samples/oiio/raw/RAW_{CANON_EOS_7D.CR2,FUJI_F700.RAF,NIKON_D3X.NEF,OLYMPUS_E3.ORF,PANASONIC_DMC-GF1.RW2,PANASONIC_G1.RW2,SONY_A300.ARW} raw-samples/ci/
          rm -rf raw-samples/oiio
          ls -la raw-samples/ci

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      # Errors are also emitted as annotations so they show up on the run summary
      - name: Clippy
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          set +e
          cargo clippy --workspace --all-targets --message-format=short -- -D warnings 2>&1 | tee clippy.txt
          code=${PIPESTATUS[0]}
          if [ "$code" != 0 ]; then
            { grep -E '(^|: )error(\[|:)|panicked' clippy.txt | head -15; tail -5 clippy.txt; } | sed 's/^/::error::/'
          fi
          exit $code
      - name: Tests
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          set +e
          if [ "$RUNNER_OS" = Linux ]; then
            export LUMENKORN_TEST_RAW="$GITHUB_WORKSPACE/raw-samples/ci"
          fi
          cargo test --workspace --no-fail-fast 2>&1 | tee tests.txt
          code=${PIPESTATUS[0]}
          if [ "$code" != 0 ]; then
            # GitHub shows at most 10 error annotations per step, so the panic
            # messages go into one multi-line annotation
            grep -E "FAILED$" tests.txt | head -9 | sed 's/^/::error::/'
            msg=$(grep -E "panicked at" -A4 tests.txt | head -120 | tr -d '\r' \
              | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Panics::$msg"
          fi
          exit $code

  # Every green push to main builds a Windows installer (MSI). It is kept as a
  # workflow artifact and published as the rolling pre-release "nightly", which
  # always points at the latest main. Versioned releases come from release.yml.
  msi:
    name: Windows installer (MSI)
    needs: [frontend, rust]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: msi
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Build MSI
        run: npm run tauri build -- --bundles msi

      # One installer per language (German and English, see bundle.windows.wix.language)
      - name: Collect MSI
        id: msi
        shell: bash
        run: |
          ls target/release/bundle/msi/*.msi
          test -n "$(ls target/release/bundle/msi/*.msi)"
          echo "names=$(cd target/release/bundle/msi && ls *.msi | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: lumenkorn-msi-${{ github.sha }}
          path: target/release/bundle/msi/*.msi
          retention-days: 30

      - name: Publish as "nightly" pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly target/release/bundle/msi/*.msi \
            --target "$GITHUB_SHA" --prerelease \
            --title "Lumenkorn – aktueller Stand (main)" \
            --notes "Automatisch gebaut aus ${GITHUB_SHA::7} am $(date -u '+%Y-%m-%d %H:%M') UTC.

          Installer für Windows (Deutsch \`de-DE\`, English \`en-US\` – nur die Sprache des Installationsprogramms; die App
          folgt der Systemsprache und lässt sich unten links umstellen): ${{ steps.msi.outputs.names }}. Ein neuer Stand lässt sich einfach über
          den alten installieren; Katalog und Bearbeitungen bleiben erhalten.

          Nicht signiert: Windows SmartScreen fragt beim ersten Start nach (\"Weitere Informationen\" → \"Trotzdem ausführen\")."
