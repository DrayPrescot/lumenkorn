name: Audit

# Bekannte Sicherheitslücken in den Abhängigkeiten. Wöchentlich statt bei jedem
# Push: Das braucht kaum Actions-Minuten, und neue Meldungen kommen unabhängig von
# eigenen Änderungen. Bewusst hingenommene Meldungen stehen in .cargo/audit.toml.

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2
        with:
          tool: cargo-audit
      - run: cargo audit
      - run: npm audit --omit=dev
